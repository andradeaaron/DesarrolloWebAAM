<h2>Nuevo producto</h2>
<div id="erroresAlta" class="aviso aviso-error oculto"></div>
<form id="formProducto" enctype="multipart/form-data" novalidate>
    <div class="fila">
        <div class="campo">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre" maxlength="60" autocomplete="off">
        </div>
        <div class="campo">
            <label for="categoria">Categoría</label>
            <select id="categoria" name="categoria_id">
                <option value="">-- Seleccione --</option>
            </select>
        </div>
        <div class="campo">
            <label for="precio">Precio (Bs)</label>
            <input type="number" id="precio" name="precio" step="0.01" min="0">
        </div>
    </div>
    <div class="campo">
        <label for="descripcion">Descripción</label>
        <textarea id="descripcion" name="descripcion" rows="2" maxlength="255"></textarea>
    </div>
    <div class="fila">
        <div class="campo">
            <label for="imagen">Fotografía (jpg, png o webp, máx. 2 MB)</label>
            <input type="file" id="imagen" name="imagen" accept=".jpg,.jpeg,.png,.webp">
        </div>
        <div class="campo">
            <label for="disponible">Disponible</label>
            <select id="disponible" name="disponible">
                <option value="1">Sí</option>
                <option value="0">No</option>
            </select>
        </div>
    </div>
    <button type="submit" class="boton boton-ok">Guardar producto</button>
</form>
